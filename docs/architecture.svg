<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Whistle Architecture</title>
  <desc id="desc">Whistle daily report architecture from scheduler and headless agent to sources, ranking, report generation, Resend email, and Vercel archive.</desc>
  <defs>
    <style>
      .bg { fill: #f7f1e7; }
      .panel { fill: #fffaf2; stroke: #d8cbb8; stroke-width: 2; }
      .panel-soft { fill: #f1e7d8; stroke: #d8cbb8; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #cbbba5; stroke-width: 2; }
      .box-blue { fill: #edf4fb; stroke: #174a7c; stroke-width: 2; }
      .box-green { fill: #edf7f0; stroke: #2f7d4f; stroke-width: 2; }
      .box-gold { fill: #fff5d7; stroke: #a66a00; stroke-width: 2; }
      .box-red { fill: #fff0ed; stroke: #b65c4a; stroke-width: 2; }
      .title { font: 700 40px Georgia, "Songti SC", serif; fill: #172033; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667085; }
      .label { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .small { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #46515f; }
      .tiny { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667085; }
      .section-title { font: 800 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #174a7c; letter-spacing: .08em; }
      .arrow { fill: none; stroke: #174a7c; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-muted { fill: none; stroke: #9b8f80; stroke-width: 2.5; marker-end: url(#arrow-muted); }
      .dash { stroke-dasharray: 8 8; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#174a7c"/>
    </marker>
    <marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#9b8f80"/>
    </marker>
  </defs>

  <rect class="bg" width="1440" height="980"/>

  <text x="72" y="72" class="title">Whistle 架构设计</text>
  <text x="72" y="106" class="subtitle">可配置信息源 · 低噪音排序 · Kami 报告排版 · Resend 邮件 · Vercel 归档</text>

  <rect x="56" y="140" width="1328" height="760" rx="20" class="panel"/>

  <rect x="86" y="180" width="240" height="640" rx="16" class="panel-soft"/>
  <text x="112" y="220" class="section-title">TRIGGER</text>
  <rect x="112" y="252" width="188" height="86" rx="10" class="box-blue"/>
  <text x="138" y="286" class="label">GitHub Actions</text>
  <text x="138" y="314" class="small">每日定时 / 手动触发</text>
  <rect x="112" y="380" width="188" height="86" rx="10" class="box"/>
  <text x="138" y="414" class="label">Codex Exec</text>
  <text x="138" y="442" class="small">Headless Agent</text>
  <path d="M206 338 L206 376" class="arrow"/>

  <rect x="370" y="180" width="250" height="640" rx="16" class="panel-soft"/>
  <text x="396" y="220" class="section-title">CONFIG &amp; SKILLS</text>
  <rect x="398" y="252" width="194" height="82" rx="10" class="box"/>
  <text x="426" y="284" class="label">sources.yaml</text>
  <text x="426" y="312" class="small">源 / 主题 / 权重</text>
  <rect x="398" y="366" width="194" height="82" rx="10" class="box"/>
  <text x="426" y="398" class="label">skills/</text>
  <text x="426" y="426" class="small">RSS · Ranking · Kami</text>
  <rect x="398" y="480" width="194" height="82" rx="10" class="box"/>
  <text x="426" y="512" class="label">daily_report.md</text>
  <text x="426" y="540" class="small">Agent 执行说明</text>
  <path d="M300 423 C330 423 352 293 394 293" class="arrow-muted dash"/>
  <path d="M300 423 C336 423 352 407 394 407" class="arrow-muted dash"/>
  <path d="M300 423 C330 423 352 521 394 521" class="arrow-muted dash"/>

  <rect x="664" y="180" width="300" height="640" rx="16" class="panel-soft"/>
  <text x="690" y="220" class="section-title">INTELLIGENCE PIPELINE</text>
  <rect x="694" y="252" width="240" height="82" rx="10" class="box-green"/>
  <text x="724" y="284" class="label">RSS 信息源</text>
  <text x="724" y="312" class="small">OpenAI / Anthropic / HN</text>
  <rect x="694" y="366" width="240" height="82" rx="10" class="box"/>
  <text x="724" y="398" class="label">原始条目池</text>
  <text x="724" y="426" class="small">raw-items.json</text>
  <rect x="694" y="480" width="240" height="82" rx="10" class="box-gold"/>
  <text x="724" y="512" class="label">去重 · 去噪 · 排序</text>
  <text x="724" y="540" class="small">时效 / 权重 / 主题 / 新颖度</text>
  <rect x="694" y="594" width="240" height="82" rx="10" class="box"/>
  <text x="724" y="626" class="label">精选条目</text>
  <text x="724" y="654" class="small">ranked-items.json</text>
  <path d="M814 334 L814 362" class="arrow"/>
  <path d="M814 448 L814 476" class="arrow"/>
  <path d="M814 562 L814 590" class="arrow"/>
  <path d="M592 407 C630 407 648 293 690 293" class="arrow-muted dash"/>
  <path d="M592 407 C630 407 648 521 690 521" class="arrow-muted dash"/>

  <rect x="1008" y="180" width="326" height="640" rx="16" class="panel-soft"/>
  <text x="1034" y="220" class="section-title">PUBLISHING</text>
  <rect x="1040" y="252" width="254" height="82" rx="10" class="box-blue"/>
  <text x="1070" y="284" class="label">Kami 风格报告</text>
  <text x="1070" y="312" class="small">report.md / report.html</text>
  <rect x="1040" y="366" width="254" height="82" rx="10" class="box"/>
  <text x="1070" y="398" class="label">HTML 转 PDF</text>
  <text x="1070" y="426" class="small">Playwright / Chromium</text>
  <rect x="1040" y="480" width="112" height="82" rx="10" class="box-red"/>
  <text x="1064" y="512" class="label">Resend</text>
  <text x="1064" y="540" class="small">邮件 PDF</text>
  <rect x="1182" y="480" width="112" height="82" rx="10" class="box-green"/>
  <text x="1210" y="512" class="label">Vercel</text>
  <text x="1210" y="540" class="small">HTML 归档</text>
  <rect x="1040" y="594" width="254" height="82" rx="10" class="box"/>
  <text x="1070" y="626" class="label">自定义域名</text>
  <text x="1070" y="654" class="small">brief.yourdomain.com</text>
  <path d="M934 635 C970 635 992 293 1036 293" class="arrow"/>
  <path d="M1167 334 L1167 362" class="arrow"/>
  <path d="M1110 448 L1110 476" class="arrow"/>
  <path d="M1222 448 L1234 476" class="arrow"/>
  <path d="M1238 562 L1190 590" class="arrow"/>

  <rect x="398" y="706" width="896" height="66" rx="12" class="box"/>
  <text x="426" y="734" class="label">可观测与调试</text>
  <text x="426" y="758" class="small">抓取异常 · 过滤数量 · 评分依据 · 每日输出文件 · CI 日志</text>
  <path d="M814 676 L814 702" class="arrow-muted dash"/>
  <path d="M1167 676 C1167 724 1058 739 1298 739" class="arrow-muted dash"/>

  <text x="72" y="944" class="tiny">核心链路：定时触发 → Agent 编排 → RSS 采集 → 去重去噪排序 → Kami 排版 → PDF 邮件 + HTML 归档</text>
</svg>
