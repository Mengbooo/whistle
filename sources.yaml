profile:
  name: Whistle Daily Brief
  timezone: Asia/Shanghai
  language: zh-CN
  max_items: 26
  brief_items: 6
  lookback_days: 7

sections:
  - id: headlines
    name: 今日头条
    max_items: 5
    min_items: 3
    description: 最重要的 3 到 5 条互联网相关大事，每条回答发生了什么、为什么重要、影响谁。
    keywords:
      - launch
      - announces
      - release
      - platform
      - regulation
      - funding
      - acquisition
      - OpenAI
      - Google
      - Microsoft
      - Meta
      - GitHub

  - id: ai-tools
    name: AI 与新工具
    max_items: 9
    min_items: 4
    priority: 1.25
    description: 模型、Agent、开发工具、效率工具、设计/运营/内容工具。本板块允许适当多一些。
    keywords:
      - AI
      - LLM
      - agent
      - coding agent
      - Copilot
      - Codex
      - Claude
      - ChatGPT
      - model
      - benchmark
      - developer tools
      - automation

  - id: platforms
    name: 大厂与平台动态
    max_items: 4
    min_items: 2
    description: 大厂、平台规则、产品策略、接口、商业化、生态变化。
    keywords:
      - OpenAI
      - Google
      - Meta
      - Microsoft
      - Apple
      - Amazon
      - GitHub
      - platform
      - API
      - ecosystem

  - id: product-growth
    name: 产品与增长观察
    max_items: 3
    min_items: 1
    description: 产品改版、推荐机制、增长方式、内容形态、商业化变化。
    keywords:
      - growth
      - product
      - users
      - adoption
      - monetization
      - pricing
      - recommendation
      - creator
      - marketplace

  - id: engineering
    name: 开发者与工程实践
    max_items: 4
    min_items: 1
    description: 高质量工程复盘、开发工具更新、开源生态变化。
    keywords:
      - engineering
      - developer
      - open source
      - GitHub
      - release
      - incident
      - performance
      - infrastructure
      - Rust
      - Linux
      - Cloudflare

  - id: opportunities
    name: 投融资与行业机会
    max_items: 2
    min_items: 0
    description: 强信号融资、并购、SaaS、出海、广告、电商、新业务。
    keywords:
      - funding
      - raises
      - acquisition
      - acquires
      - startup
      - SaaS
      - enterprise
      - revenue
      - business

  - id: policy
    name: 政策监管与合规
    max_items: 2
    min_items: 0
    description: AI 监管、数据合规、平台治理、广告政策、隐私与跨境。
    keywords:
      - regulation
      - policy
      - privacy
      - compliance
      - safety
      - governance
      - law
      - age assurance
      - copyright

  - id: social-buzz
    name: 社交热度观察
    max_items: 3
    min_items: 0
    description: 相关但话题性强于工作性的内容，只放在本板块，不挤占头条与工作信号排序。
    keywords:
      - viral
      - trending
      - controversy
      - lawsuit
      - debate
      - HN
      - Hacker News
      - Reddit
      - X
      - Threads
      - 社交
      - 热议
      - 争议
      - 讨论
      - 舆论
      - 诉讼
      - 爆火

  - id: actions
    name: 今日行动建议
    max_items: 0
    min_items: 0
    description: 由 Agent 基于前面板块生成，不直接从 RSS 选条目。

topics:
  include:
    - AI agent
    - coding agent
    - developer tools
    - LLM
    - OpenAI
    - Anthropic
    - GitHub Copilot
    - Claude Code
    - Codex
    - ChatGPT
    - product growth
    - platform
    - regulation
    - open source
    - China
    - global
    - economy
    - semiconductor
    - chip
    - startup
