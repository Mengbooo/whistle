    community: 0.14
    consumer-tech: 0.12

ranking:
  recency: 0.24
  source_weight: 0.20
  keyword_match: 0.20
  novelty: 0.16
  source_repeat_penalty: 0.10
  section_match_bonus: 0.10
  weak_relevance_penalty: 0.28
  work_signal_bonus: 0.24
  topic_noise_penalty: 0.30
  title_only_penalty: 0.10
  min_adjusted_score: 0.10

