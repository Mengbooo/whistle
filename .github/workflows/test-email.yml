name: Scheduled Test Email

on:
  workflow_dispatch:

jobs:
  send-test-email:
    runs-on: ubuntu-latest

    steps:
      - name: Send test email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: |
          node <<'EOF'
          const apiKey = process.env.RESEND_API_KEY;
          const from = process.env.REPORT_FROM;
          const to = process.env.REPORT_TO;

          if (!apiKey || !from || !to) {
            throw new Error("Missing RESEND_API_KEY, REPORT_FROM, or REPORT_TO");
          }

          const now = new Intl.DateTimeFormat("zh-CN", {
            timeZone: "Asia/Shanghai",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false,
          }).format(new Date());

          const payload = {
            from,
            to: [to],
            subject: `Whistle CI 定时测试｜${now}`,
            html: `
              <!doctype html>
              <html lang="zh-CN">
                <body style="margin:0;padding:24px;background:#f5f4ed;color:#141413;font-family:Georgia,'Songti SC',serif;">
                  <main style="max-width:640px;margin:0 auto;">
                    <p style="margin:0 0 8px;color:#6b6a64;font-size:12px;letter-spacing:1px;text-transform:uppercase;">Whistle CI Test</p>
                    <h1 style="margin:0 0 16px;font-size:26px;line-height:1.25;font-weight:500;">GitHub Actions 定时任务已触发</h1>
                    <p style="margin:0 0 12px;font-size:15px;line-height:1.7;color:#3d3d3a;">
                      这是一封用于验证 GitHub Actions 定时任务是否正常运行的测试邮件。
                    </p>
                    <p style="margin:0;font-size:15px;line-height:1.7;color:#3d3d3a;">
                      触发时间（北京时间）：${now}
                    </p>
                  </main>
                </body>
              </html>
            `,
          };

          const response = await fetch("https://api.resend.com/emails", {
            method: "POST",
            headers: {
              Authorization: `Bearer ${apiKey}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });

          const text = await response.text();
          if (!response.ok) {
            throw new Error(`Resend failed (${response.status}): ${text}`);
          }

          console.log("Sent scheduled test email.");
          EOF
