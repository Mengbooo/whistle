name: Daily Whistle Email

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify report artifacts
        run: |
          test -f "outputs/$(TZ=Asia/Shanghai date +%F)/report.html"
          test -f "outputs/$(TZ=Asia/Shanghai date +%F)/report.pdf"
          test -f "site/reports/$(TZ=Asia/Shanghai date +%F).html"

      - name: Send PDF email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          REPORT_BASE_URL: ${{ secrets.REPORT_BASE_URL }}
        run: pnpm run email
