name: Daily Whistle Email

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      whistle_date:
        description: "Optional report date in YYYY-MM-DD (Asia/Shanghai)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify report artifacts
        env:
          WHISTLE_DATE: ${{ inputs.whistle_date }}
        run: |
          TARGET_DATE="${WHISTLE_DATE:-$(TZ=Asia/Shanghai date +%F)}"
          test -f "outputs/$TARGET_DATE/report.html"
          test -f "outputs/$TARGET_DATE/report.pdf"
          test -f "site/reports/$TARGET_DATE.html"

      - name: Send PDF email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          REPORT_BASE_URL: ${{ secrets.REPORT_BASE_URL }}
          WHISTLE_DATE: ${{ inputs.whistle_date }}
        run: pnpm run email

      - name: Notify email failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_TYPE: ${{ secrets.ALERT_WEBHOOK_TYPE }}
          WHISTLE_DATE: ${{ inputs.whistle_date }}
        run: node scripts/send-webhook-alert.js email-delivery
