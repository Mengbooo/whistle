name: Daily Whistle Report

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      whistle_date:
        description: "Optional report date in YYYY-MM-DD (Asia/Shanghai)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Configure pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium
          pnpm add -g @openai/codex

      - name: Configure Codex provider
        env:
          MICU_API_KEY: ${{ secrets.MICU_API_KEY }}
          MICU_BASE_URL: ${{ secrets.MICU_BASE_URL }}
          MICU_MODEL: ${{ secrets.MICU_MODEL }}
        run: |
          mkdir -p ~/.codex
          cat > ~/.codex/config.toml <<EOF
          model = "${MICU_MODEL:-gpt-5.4}"
          model_provider = "micu"
          model_reasoning_effort = "medium"
          disable_response_storage = true

          [model_providers.micu]
          base_url = "${MICU_BASE_URL:-https://www.openclaudecode.cn/v1}"
          name = "micu"
          env_key = "MICU_API_KEY"
          wire_api = "responses"
          EOF

      - name: Validate MICU API
        env:
          MICU_API_KEY: ${{ secrets.MICU_API_KEY }}
          MICU_BASE_URL: ${{ secrets.MICU_BASE_URL }}
          MICU_MODEL: ${{ secrets.MICU_MODEL }}
        run: |
          test -n "$MICU_API_KEY"
          EFFECTIVE_MICU_BASE_URL="${MICU_BASE_URL:-https://www.openclaudecode.cn/v1}"
          STATUS="$(curl -sS -o /tmp/micu-models.json -w "%{http_code}" \
            -H "Authorization: Bearer $MICU_API_KEY" \
            "$EFFECTIVE_MICU_BASE_URL/models")"
          echo "MICU /models status=$STATUS"
          if [ "$STATUS" = "401" ]; then
            echo "MICU_API_KEY was rejected by the configured provider."
            exit 1
          fi
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Unexpected MICU API status."
            cat /tmp/micu-models.json
            exit 1
          fi
          RESPONSES_STATUS="$(curl -sS -o /tmp/micu-responses.json -w "%{http_code}" \
            -H "Authorization: Bearer $MICU_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"${MICU_MODEL:-gpt-5.4}\",\"input\":\"ping\"}" \
            "$EFFECTIVE_MICU_BASE_URL/responses")"
          echo "MICU /responses status=$RESPONSES_STATUS"
          if [ "$RESPONSES_STATUS" -lt 200 ] || [ "$RESPONSES_STATUS" -ge 300 ]; then
            echo "Unexpected MICU /responses status."
            cat /tmp/micu-responses.json
            exit 1
          fi

      - name: Generate report with headless agent
        env:
          MICU_API_KEY: ${{ secrets.MICU_API_KEY }}
          MICU_BASE_URL: ${{ secrets.MICU_BASE_URL }}
          MICU_MODEL: ${{ secrets.MICU_MODEL }}
          WHISTLE_DATE: ${{ inputs.whistle_date }}
        run: |
          test -n "$MICU_API_KEY"
          codex exec \
            --cd . \
            --dangerously-bypass-approvals-and-sandbox \
            --model "${MICU_MODEL:-gpt-5.4}" \
            "$(cat prompts/daily_report.md)"

      - name: Verify generated report
        env:
          WHISTLE_DATE: ${{ inputs.whistle_date }}
        run: |
          TARGET_DATE="${WHISTLE_DATE:-$(TZ=Asia/Shanghai date +%F)}"
          test -f "outputs/$TARGET_DATE/report.html"
          test -f "outputs/$TARGET_DATE/report.pdf"
          test -f "site/reports/$TARGET_DATE.html"

      - name: Commit report archive
        run: |
          git config user.name "whistle-bot"
          git config user.email "whistle-bot@users.noreply.github.com"
          git add outputs/ site/
          git commit -m "Update Whistle report" || echo "No changes"
          git push

      - name: Notify report failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          WHISTLE_DATE: ${{ inputs.whistle_date }}
        run: node scripts/send-failure-alert.js report-generation
